# Android Auto DPI. Lower = smaller text/icons, more on screen.
# The head unit's own value is 240 on the wide 1920x720 / 1240x720 screens and
# 160 on 800x465. aa-proxy-rs users typically pick 130-160.
# An aa-dpi.txt in the top folder of the install USB drive overrides this file.
DPI=160
# real_density: a number, empty for the same as DPI (what aa-proxy-rs does),
# or keep to leave the head unit's values (167/200 on the wide screens).
REAL_DPI=
# off = remove the phone's tap/scroll limit while driving ("you've scrolled a
# lot" lockout), like aa-proxy-rs remove_tap_restriction: the head unit stops
# declaring its speed sensor. on (or empty) = stock.
TAP_LIMIT=on
